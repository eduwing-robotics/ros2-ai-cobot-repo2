<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="960" viewBox="0 0 1700 960">
  <defs>
    <style>
      .bg { fill:#0d1117; }
      .panel { fill:#161b22; stroke:#57606a; stroke-width:2; }
      .box { fill:#0d1117; stroke:#8b949e; stroke-width:2; }
      .title { fill:#f0f6fc; font:700 28px 'Segoe UI','Malgun Gothic',sans-serif; }
      .group { fill:#f0f6fc; font:700 23px 'Segoe UI','Malgun Gothic',sans-serif; }
      .label { fill:#f0f6fc; font:600 18px 'Segoe UI','Malgun Gothic',sans-serif; }
      .small { fill:#c9d1d9; font:500 15px 'Segoe UI','Malgun Gothic',sans-serif; }
      .note { fill:#c9d1d9; font:500 14px 'Segoe UI','Malgun Gothic',sans-serif; }
      .line { fill:none; stroke:#c9d1d9; stroke-width:2.5; }
      .dash { fill:none; stroke:#c9d1d9; stroke-width:2.5; stroke-dasharray:10 8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9d1d9"/>
    </marker>
    <marker id="arrowStart" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M10,0 L0,5 L10,10 z" fill="#c9d1d9"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1700" height="960"/>
  <text class="title" x="850" y="48" text-anchor="middle">Vision 전체 시스템 구성</text>

  <rect class="panel" x="80" y="80" width="1540" height="205" rx="18"/>
  <text class="group" x="110" y="120">Camera Layer</text>

  <rect class="box" x="160" y="150" width="360" height="90" rx="10"/>
  <text class="label" x="340" y="185" text-anchor="middle">Incoming Inspection Camera</text>
  <text class="small" x="340" y="214" text-anchor="middle">RTSP / Incoming Inspection</text>

  <rect class="box" x="670" y="150" width="360" height="90" rx="10"/>
  <text class="label" x="850" y="185" text-anchor="middle">Factory View Camera</text>
  <text class="small" x="850" y="214" text-anchor="middle">Logitech C270</text>

  <rect class="box" x="1180" y="150" width="360" height="90" rx="10"/>
  <text class="label" x="1360" y="185" text-anchor="middle">Intel RealSense D435</text>
  <text class="small" x="1360" y="214" text-anchor="middle">RGB + Depth / PRE_ROOF 5-View</text>

  <rect class="panel" x="80" y="330" width="1540" height="300" rx="18"/>
  <text class="group" x="110" y="370">AI Perception / Vision</text>

  <rect class="box" x="130" y="405" width="390" height="105" rx="10"/>
  <text class="label" x="325" y="440" text-anchor="middle">입고 자재 검사</text>
  <text class="small" x="325" y="470" text-anchor="middle">YOLO + Auto Alignment + QA</text>

  <rect class="box" x="630" y="405" width="360" height="105" rx="10"/>
  <text class="label" x="810" y="440" text-anchor="middle">Factory View Pipeline</text>
  <text class="small" x="810" y="470" text-anchor="middle">FFmpeg + ROS2</text>

  <rect class="box" x="1090" y="405" width="360" height="105" rx="10"/>
  <text class="label" x="1270" y="440" text-anchor="middle">PRE_ROOF 5방향 QC</text>
  <text class="small" x="1270" y="470" text-anchor="middle">TOP / LEFT / RIGHT / FRONT / BEHIND</text>

  <rect class="box" x="650" y="545" width="320" height="62" rx="10"/>
  <text class="label" x="810" y="584" text-anchor="middle">HMV1 영상 전송</text>

  <rect class="panel" x="80" y="675" width="1540" height="220" rx="18"/>
  <text class="group" x="110" y="715">Team Server / Robot Control / Unity</text>

  <rect class="box" x="170" y="765" width="330" height="78" rx="10"/>
  <text class="label" x="335" y="812" text-anchor="middle">Team Server / FMS</text>

  <rect class="box" x="685" y="765" width="280" height="78" rx="10"/>
  <text class="label" x="825" y="812" text-anchor="middle">Robot Control</text>

  <rect class="box" x="1180" y="765" width="330" height="78" rx="10"/>
  <text class="label" x="1345" y="812" text-anchor="middle">Unity Digital Twin</text>

  <path class="line" d="M340 240 V405" marker-end="url(#arrow)"/>
  <path class="line" d="M850 240 V405" marker-end="url(#arrow)"/>
  <path class="line" d="M1360 240 V405" marker-end="url(#arrow)"/>

  <path class="line" d="M325 510 V535 H650 V545" marker-end="url(#arrow)"/>
  <path class="line" d="M810 510 V545" marker-end="url(#arrow)"/>
  <path class="line" d="M1270 510 V535 H970 V545" marker-end="url(#arrow)"/>

  <path class="line" d="M255 510 V650 H250 V765"
        marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <text class="note" x="270" y="652">Request / Result</text>

  <path class="line" d="M1190 510 V650 H420 V765"
        marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
  <text class="note" x="955" y="645">검사 요청 / 결과</text>

  <path class="dash" d="M825 765 V690 H1555 V285 H1360 V240"
        marker-end="url(#arrow)"/>
  <text class="note" x="1280" y="686">D435 View 이동</text>

  <path class="line" d="M810 607 V690 H1345 V765" marker-end="url(#arrow)"/>
  <text class="note" x="1060" y="686">Annotated Video</text>

  <path class="line" d="M500 804 H685"
        marker-start="url(#arrowStart)" marker-end="url(#arrow)"/>
</svg>
